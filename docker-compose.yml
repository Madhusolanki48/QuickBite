services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  eureka-server:
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8081:8081"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_DATABASE: quickbite_auth
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      MAIL_FROM: ${MAIL_FROM:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      QUICKBITE_RABBITMQ_ENABLED: true
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      - eureka-server
      - rabbitmq

  restaurant-service:
    build:
      context: ./restaurant-service
    ports:
      - "8082:8082"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_DATABASE: quickbite_restaurant
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:-}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - eureka-server
      - redis

  order-service:
    build:
      context: ./order-service
    ports:
      - "8083:8083"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_DATABASE: quickbite_order
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      MAIL_FROM: ${MAIL_FROM:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
      SERVICES_RESTAURANT_SERVICE_URL: http://restaurant-service:8082
      SERVICES_DELIVERY_SERVICE_URL: http://delivery-service:8085
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      - eureka-server
      - rabbitmq

  payment-service:
    build:
      context: ./payment-service
    ports:
      - "8084:8084"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_DATABASE: quickbite_payment
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:-}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  delivery-service:
    build:
      context: ./delivery-service
    ports:
      - "8085:8085"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_DATABASE: quickbite_delivery
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:-}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  review-service:
    build:
      context: ./review-service
    ports:
      - "8086:8086"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_DATABASE: quickbite_review
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  cart-service:
    build:
      context: ./cart-service
    ports:
      - "8088:8088"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_DATABASE: quickbite_cart
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      REVIEW_SERVICE_URL: http://review-service:8086
      CART_SERVICE_URL: http://cart-service:8088
      DELIVERY_SERVICE_URL: http://delivery-service:8085
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_CURRENCY: INR
      RAZORPAY_API_BASE_URL: https://api.razorpay.com/v1
    depends_on:
      - eureka-server
      - auth-service
      - restaurant-service
      - order-service
      - payment-service
      - delivery-service
      - review-service
      - cart-service
